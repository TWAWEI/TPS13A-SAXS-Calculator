# GitHub Pages 部署 workflow
# 當推送到 main 分支時自動部署

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  
  # 允許手動觸發部署
  workflow_dispatch:

# 設定 GITHUB_TOKEN 權限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允許一個部署同時進行
concurrency:
  group: "pages"
  cancel-in-progress: false

# 上傳與部署分成兩個 job（GitHub 官方 Pages 範本的做法）：
# 同一個 job 裡上傳後立刻部署時，deploy-pages 偶爾查不到剛上傳的 artifact
# （"No artifacts named github-pages were found"，2026-11-24 連續四次）。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上傳 saxs-calculator 目錄
          path: './saxs-calculator'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
